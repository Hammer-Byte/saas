<div style="background:#f6f8fb;padding:24px 12px;font-family:sans-serif;color:#1f2937;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:32px;">
    <h2 style="margin:0 0 12px;color:#111827;">Missing inquiry follow-up</h2>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin-bottom:20px;">
      Hi {{recipient_name}},<br>
      Follow-up #{{slot}} is overdue for this potential inquiry (due {{due_label}}).
    </p>
    <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:20px;font-size:14px;line-height:1.6;color:#374151;">
      <div><strong>ID:</strong> #{{record_id}}</div>
      <div><strong>Name:</strong> {{full_name}}</div>
      <div><strong>Phone:</strong> {{phone}}</div>
      <div><strong>Follow-up:</strong> #{{slot}}</div>
    </div>
    <p style="font-size:14px;color:#6b7280;margin:0 0 16px;">
      <a href="{{detail_url}}" style="color:#2563eb;">Open inquiry #{{record_id}}</a>
    </p>
    <div style="padding-top:20px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af;">
      {{app_name}} Team
    </div>
  </div>
</div>
