<div style="background:#f6f8fb;padding:24px 12px;font-family:sans-serif;color:#1f2937;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:32px;">
    <h2 style="margin:0 0 12px;color:#b91c1c;">Server metric alert — {{alert_title}}</h2>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin-bottom:20px;">
      Hi {{recipient_name}},<br>
      A metric threshold was exceeded on a monitored server.
    </p>
    <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:16px;margin-bottom:20px;font-size:14px;line-height:1.6;color:#374151;">
      <div><strong>Server:</strong> {{server_name}}</div>
      <div><strong>Location:</strong> {{server_location}}</div>
      <div><strong>Alert:</strong> {{alert_detail}}</div>
      <div><strong>Captured at:</strong> {{captured_at}}</div>
    </div>
    <p style="font-size:14px;margin:0 0 16px;">
      <a href="{{server_url}}" style="color:#2563eb;">Open server</a>
    </p>
    <div style="padding-top:20px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af;">
      {{app_name}} Team
    </div>
  </div>
</div>
