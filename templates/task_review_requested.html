<div style="background:#f6f8fb;padding:24px 12px;font-family:sans-serif;color:#1f2937;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:32px;">
    <h2 style="margin:0 0 12px;color:#111827;">Task review requested</h2>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin-bottom:20px;">
      Hi {{reviewer_name}},<br>
      {{requested_by_name}} moved a task to <strong>Under review</strong> and assigned you as reviewer.
    </p>
    <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:20px;font-size:14px;line-height:1.6;color:#374151;">
      <div><strong>Title:</strong> {{task_title}}</div>
      <div><strong>State:</strong> {{task_state}}</div>
      <div><strong>Priority:</strong> {{task_priority}}</div>
      <div><strong>Assignee:</strong> {{assignee_name}}</div>
      <div><strong>Due:</strong> {{task_end_at}}</div>
    </div>
    <p style="font-size:14px;margin:0 0 16px;">
      <a href="{{task_url}}" style="color:#2563eb;">Open task #{{record_id}}</a>
    </p>
    <div style="padding-top:20px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af;">
      {{app_name}} Team
    </div>
  </div>
</div>
