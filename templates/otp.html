<div style="background:#f6f8fb;padding:24px 12px;font-family:sans-serif;color:#1f2937;">
  <div style="max-width:500px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:32px;text-align:center;">
    <h2 style="margin:0 0 12px;color:#111827;">Verify Your Login</h2>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin-bottom:24px;">
      Hello,<br>Use the code below to complete your sign-in.
    </p>
    <div style="display:inline-block;background:#111827;color:#fff;font-size:32px;letter-spacing:8px;font-weight:700;padding:14px 28px;border-radius:8px;margin-bottom:24px;">
      {{otp}}
    </div>
    <p style="font-size:14px;color:#6b7280;margin:0 0 16px;">
      Valid for <b>{{valid_for_minutes}} minutes</b>. Do not share this code.
    </p>
    <div style="padding-top:20px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af;">
      {{app_name}} Team
    </div>
  </div>
</div>
