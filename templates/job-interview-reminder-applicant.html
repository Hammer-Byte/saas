<div style="background:#f6f8fb;padding:24px 12px;font-family:sans-serif;color:#1f2937;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:32px;">
    <h2 style="margin:0 0 12px;color:#111827;">Interview starting soon</h2>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin:0 0 16px;">
      Hello {{full_name}},
    </p>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin:0 0 16px;">
      Reminder: your interview for <b>{{job_title}}</b> starts in about 10 minutes
      (<b>{{interview_date}}</b> at <b>{{interview_time}}</b>).
    </p>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin:0 0 16px;">
      Joining link:
      <a href="{{meeting_link}}" style="color:#2563eb;word-break:break-all;">{{meeting_link}}</a>
    </p>
    <p style="font-size:15px;line-height:1.5;color:#374151;margin:0 0 16px;">
      Please join a few minutes early.
    </p>
    <div style="padding-top:20px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af;">
      {{app_name}} Team
    </div>
  </div>
</div>
